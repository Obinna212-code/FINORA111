<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A"><meta name="description" content="FINORA — by Kalu Obinna. Know your money. Grow your future.">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="/finora-icon-192.png"><link rel="apple-touch-icon" href="/finora-icon-192.png">
<title>FINORA — by Kalu Obinna</title>
<style>
:root{--navy:#0F172A;--teal:#06B6D4;--green:#00C896;--mint:#A7F3D0;--bg:#F6F8FB;--card:#fff;--ink:#132238;--muted:#718096;--line:#E5EBF0;--danger:#D94F63;--good:#00896F;--soft:#E8FAF6;--shadow:0 12px 32px rgba(15,23,42,.07)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:86px}.top{background:linear-gradient(135deg,#0F172A,#122E4A);color:#fff;padding:17px 17px 22px;position:sticky;top:0;z-index:5;box-shadow:0 10px 24px rgba(15,23,42,.16)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brandimg{width:44px;height:44px;border-radius:13px;object-fit:cover}.brand b{font-size:21px;letter-spacing:1.7px}.brand small{display:block;font-size:10px;opacity:.72;letter-spacing:.5px}.avatar{width:39px;height:39px;border-radius:50%;border:1px solid #ffffff35;background:#ffffff12;color:#fff;font-weight:900}.greeting{margin-top:17px;font-size:12px;opacity:.7}.hero{font-size:30px;font-weight:900;letter-spacing:-.8px}.sub{font-size:12px;opacity:.72}.main{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.wide{grid-column:1/-1}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.label{font-size:10px;color:var(--muted);font-weight:850;letter-spacing:.6px}.value{font-size:25px;font-weight:900;margin-top:3px}.good{color:var(--good)}.bad{color:var(--danger)}.muted{color:var(--muted);font-size:12px}.section{font-weight:900;margin:21px 0 10px}.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.action{border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 4px;color:var(--ink);font-size:11px;font-weight:800}.action i{width:30px;height:30px;margin:0 auto 5px;display:grid;place-items:center;border-radius:9px;background:var(--soft);color:var(--good);font-style:normal;font-size:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.txleft{display:flex;gap:10px;align-items:center;min-width:0}.txleft>div:last-child{min-width:0}.iconbox{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#F1F6F9;display:grid;place-items:center;font-size:18px}.tag{display:inline-flex;background:#EAF8F7;color:var(--good);padding:4px 8px;border-radius:99px;font-size:10px;font-weight:850}.bar{height:8px;background:#E8EEF2;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:99px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:850}.primary{background:var(--navy);color:#fff}.outline{background:#fff;color:var(--ink);border:1px solid var(--line)}.danger{background:#FFF0F2;color:var(--danger);border:1px solid #FFD7DD}.search,.input,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 13px;outline:none}.search:focus,.input:focus,.select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(6,182,212,.1)}.form{display:grid;gap:11px}.form label{font-size:11px;color:var(--muted);font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:8;padding-bottom:env(safe-area-inset-bottom)}.navin{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:#fff;color:#8491A0;padding:8px 2px 7px;font-size:10px}.nav button.active{color:var(--navy);font-weight:900}.nav span{display:block;font-size:18px;line-height:20px;margin-bottom:2px}.chart{height:165px;display:flex;align-items:flex-end;gap:8px;padding-top:14px}.barcol{flex:1;text-align:center;color:var(--muted);font-size:9px}.barcol i{display:block;background:linear-gradient(180deg,var(--teal),var(--green));border-radius:7px 7px 2px 2px;margin-bottom:7px;min-height:4px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.mini strong{display:block;margin-top:3px}.goal{padding:12px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:0}.pilltabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.pilltabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:99px;font-size:11px}.pilltabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.62);z-index:20;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:780px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}.sheet h2{margin:2px 0 16px}.close{float:right;border:0;background:#EEF3F6;border-radius:9px;padding:8px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 15px;border-radius:99px;font-size:12px;font-weight:800;z-index:30;display:none}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0F172A,#12314D)}.loginbox{max-width:430px;width:100%;background:#fff;border-radius:26px;padding:25px;box-shadow:0 30px 70px rgba(0,0,0,.25)}.loginhero{width:min(100%,320px);display:block;margin:0 auto 9px;border-radius:18px}.loginbox h1{text-align:center;margin:0;font-size:26px}.loginbox p{text-align:center;color:var(--muted);font-size:12px}.loginbox .form{margin-top:20px}.loginbox .primary{width:100%;padding:13px}.setup{background:linear-gradient(135deg,#E9FFFA,#EEF9FF);border:1px solid #CDEEE7}.dangertext{color:var(--danger)}.hide{display:none!important}@media(min-width:700px){.nav{position:fixed}.modal{align-items:center}.sheet{border-radius:20px;max-width:520px}.app{box-shadow:0 0 50px rgba(15,23,42,.08)}}
</style></head>
<body><div id="root"></div><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='finora_v8';
const blank=()=>({user:{name:'',email:''},wallets:[],budget:0,categories:{Food:0,Transport:0,Bills:0,Shopping:0,Other:0},goals:[],recurring:[],tx:[],connections:[]});
let d=load(); let page='home', search='', txFilter='all', logged=localStorage.getItem('finora_logged_v8')==='1';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x||blank()}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function money(n){return '₦'+Math.abs(Number(n)||0).toLocaleString('en-NG')}
function signed(n){return (n>=0?'+':'−')+money(n)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function wallet(id){return d.wallets.find(w=>String(w.id)===String(id))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',2200)}
function go(p){page=p;search='';render()}
function nav(){return `<div class="nav"><div class="navin">${[['home','⌂','Home'],['tx','↕','Activity'],['budget','◴','Budget'],['insights','◒','Insights'],['more','☷','More']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div></div>`}
function header(title,sub){return `<header class="top"><div class="topline"><div class="brand"><img class="brandimg" src="/finora-icon.png" alt="FINORA logo"><div><b>FINORA</b><small>by Kalu Obinna</small></div></div><button class="avatar" onclick="go('more')">${esc((d.user.name||'F').charAt(0).toUpperCase())}</button></div><div class="greeting">Good day, ${esc((d.user.name||'there').split(' ')[0])}</div><div class="hero">${title}</div><div class="sub">${sub||''}</div></header>`}
function shell(body,title,sub){return `<div class="app">${header(title,sub)}<main class="main">${body}</main>${nav()}</div>`}
function totalBalance(){return d.wallets.reduce((a,w)=>a+Number(w.bal||0),0)}
function spent(){return d.tx.filter(t=>t.amount<0&&t.cat!=='Savings').reduce((a,t)=>a+Math.abs(t.amount),0)}
function home(){const total=totalBalance(),month=spent(),income=d.tx.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),pct=d.budget?Math.min(100,month/d.budget*100):0;return shell(`<div class="grid"><div class="card wide"><div class="split"><div><div class="label">TOTAL BALANCE</div><div class="value">${money(total)}</div><div class="muted">Across ${d.wallets.length} wallet${d.wallets.length===1?'':'s'}</div></div><button class="btn outline" onclick="walletModal()">+ Wallet</button></div></div><div class="card"><div class="label">THIS MONTH</div><div class="value bad">${money(month)}</div><div class="muted">spent</div></div><div class="card"><div class="label">INCOME</div><div class="value good">${money(income)}</div><div class="muted">recorded</div></div></div><div class="section">Quick actions</div><div class="actions"><button class="action" onclick="transactionModal('expense')"><i>−</i>Expense</button><button class="action" onclick="transactionModal('income')"><i>+</i>Income</button><button class="action" onclick="transferModal()"><i>⇄</i>Transfer</button><button class="action" onclick="goalModal()"><i>◎</i>Save</button><button class="action" onclick="connectAccount()"><i>↗</i>Connect</button></div><div class="section split"><span>Budget progress</span><button class="btn outline" onclick="go('budget')">Manage</button></div><div class="card"><div class="split"><div><b>${money(month)}</b><div class="muted">of ${money(d.budget)} monthly budget</div></div><span class="tag">${Math.round(pct)}%</span></div><div class="bar" style="margin-top:12px"><div class="fill" style="width:${pct}%"></div></div></div><div class="section split"><span>Recent activity</span><button class="btn outline" onclick="go('tx')">See all</button></div><div class="card">${txRows(d.tx.slice(0,5))}</div><div class="section split"><span>Connected accounts</span><button class="btn outline" onclick="connectAccount()">+ Connect</button></div><div class="card">${connectionRows()}</div><div class="section">Savings goals</div><div class="card">${d.goals.map(goalRow).join('')||'<div class="empty">No savings goals yet.</div>'}</div>`,`Your money`,`Total balance across your accounts`)}
function txRows(list){if(!list.length)return '<div class="empty">No transactions yet.</div>';return list.map(t=>{const w=wallet(t.wallet);return `<div class="row"><div class="txleft"><div class="iconbox">${catIcon(t.cat)}</div><div><b>${esc(t.name)}</b><div class="muted">${esc(t.date)} • ${esc(t.cat)} • ${esc(w?.name||'Unknown wallet')}</div></div></div><div style="text-align:right"><b class="${t.amount<0?'bad':'good'}">${signed(t.amount)}</b><br><button class="btn outline" style="padding:5px 8px;font-size:10px;margin-top:4px" onclick="deleteTx(${t.id})">Delete</button></div></div>`}).join('')}
function tx(){let list=d.tx.filter(t=>{const w=wallet(t.wallet);const match=(t.name+' '+t.cat+' '+(w?.name||'')).toLowerCase().includes(search.toLowerCase());const f=txFilter==='all'||(txFilter==='income'?t.amount>0:t.amount<0);return match&&f});return shell(`<div class="split"><div class="section" style="margin:0">Transactions</div><button class="btn primary" onclick="transactionModal('expense')">+ Add</button></div><div style="margin:12px 0"><input class="search" placeholder="Search transactions" value="${esc(search)}" oninput="search=this.value;render()"></div><div class="pilltabs"><button class="${txFilter==='all'?'active':''}" onclick="txFilter='all';render()">All</button><button class="${txFilter==='expense'?'active':''}" onclick="txFilter='expense';render()">Expense</button><button class="${txFilter==='income'?'active':''}" onclick="txFilter='income';render()">Income</button></div><div class="card">${txRows(list)}</div>`,`Activity`,`Search and manage your income and spending`)}
function budget(){const total=spent();return shell(`<div class="card"><div class="split"><div><div class="label">MONTHLY BUDGET</div><div class="value">${money(d.budget)}</div></div><button class="btn outline" onclick="editBudget()">Edit</button></div><div class="bar" style="margin:14px 0"><div class="fill" style="width:${d.budget?Math.min(100,total/d.budget*100):0}%"></div></div><div class="split"><span class="muted">Spent ${money(total)}</span><b>${money(Math.max(0,d.budget-total))} left</b></div></div><div class="section">Category budgets</div><div class="card">${Object.entries(d.categories).map(([c,lim])=>{const used=d.tx.filter(t=>t.cat===c&&t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);const pct=lim?Math.min(100,used/lim*100):0;return `<div class="goal"><div class="split"><b>${c}</b><span class="muted">${lim?money(used)+' / '+money(lim):'No limit'}</span></div><div class="bar" style="margin-top:7px"><div class="fill" style="width:${pct}%"></div></div></div>`}).join('')}</div><div class="section">Savings goals</div><div class="card">${d.goals.map(goalRow).join('')||'<div class="empty">No savings goals yet.</div>'}<button class="btn outline" style="margin-top:8px" onclick="goalModal()">+ Add goal</button></div>`,`Budget`,`Stay ahead of your spending`)}
function goalRow(g){const pct=g.target?Math.min(100,g.saved/g.target*100):0;return `<div class="goal"><div class="split"><div><b>${esc(g.name)}</b><div class="muted">${money(g.saved)} of ${money(g.target)}</div></div><button class="btn outline" style="padding:7px 9px;font-size:10px" onclick="fundGoal(${g.id})">Add</button></div><div class="bar" style="margin-top:8px"><div class="fill" style="width:${pct}%"></div></div></div>`}
function insights(){const cats={};d.tx.filter(t=>t.amount<0).forEach(t=>cats[t.cat]=(cats[t.cat]||0)+Math.abs(t.amount));const vals=Object.values(cats),max=Math.max(...vals,1),top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];return shell(`<div class="mini-grid"><div class="mini"><div class="label">SPENDING</div><strong>${money(vals.reduce((a,b)=>a+b,0))}</strong></div><div class="mini"><div class="label">TOP CATEGORY</div><strong>${esc(top?.[0]||'—')}</strong></div><div class="mini"><div class="label">GOALS</div><strong>${d.goals.length}</strong></div></div><div class="section">Spending by category</div><div class="card">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="goal"><div class="split"><b>${esc(c)}</b><b>${money(v)}</b></div><div class="bar" style="margin-top:7px"><div class="fill" style="width:${v/max*100}%"></div></div></div>`).join('')||'<div class="empty">Add transactions to see insights.</div>'}</div><div class="section">Activity</div><div class="card"><div class="chart">${[0,1,2,3,4,5,6].map((_,i)=>{const day=new Date(Date.now()-((6-i)*86400000));const key=day.toISOString().slice(0,10);const v=d.tx.filter(t=>t.iso===key&&t.amount<0).reduce((a,t)=>a+Math.abs(t.amount),0);const h=Math.max(4,Math.min(100,v/(Math.max(...d.tx.map(t=>Math.abs(t.amount)),1))*100));return `<div class="barcol"><i style="height:${h}px"></i>${day.toLocaleDateString('en',{weekday:'short'}).slice(0,1)}</div>`}).join('')}</div></div>`,`Insights`,`See where your money is going`)}
function more(){return shell(`<div class="card"><img class="brandimg" src="/finora-lockup.png" alt="FINORA by Kalu Obinna" style="width:min(100%,340px);height:auto;border-radius:14px"><p class="muted" style="margin:14px 0 0">Know your money. Grow your future.</p></div><div class="section">Wallets</div><div class="card">${d.wallets.map(w=>`<div class="row"><div><b>${esc(w.name)}</b><div class="muted">${esc(w.type)}</div></div><div style="text-align:right"><b>${money(w.bal)}</b><br><button class="btn outline" style="padding:5px 8px;font-size:10px;margin-top:4px" onclick="editWallet(${w.id})">Edit</button></div></div>`).join('')||'<div class="empty">Create your first wallet.</div>'}<button class="btn outline" style="margin-top:10px" onclick="walletModal()">+ Add wallet</button></div><div class="section">Recurring</div><div class="card">${d.recurring.map(r=>`<div class="row"><div><b>${esc(r.name)}</b><div class="muted">Every month • day ${r.day}</div></div><div style="text-align:right"><b class="${r.type==='income'?'good':'bad'}">${r.type==='income'?'+':'−'}${money(r.amount)}</b><br><button class="btn outline" style="padding:5px 8px;font-size:10px;margin-top:4px" onclick="deleteRecurring(${r.id})">Delete</button></div></div>`).join('')||'<div class="empty">No recurring items.</div>'}<button class="btn outline" style="margin-top:10px" onclick="recurringModal()">+ Add recurring</button></div><div class="section">Data & account</div><div class="card"><div class="row"><b>Currency</b><span>₦ NGN</span></div><div class="row"><b>Export backup</b><button class="btn outline" onclick="backup()">JSON</button></div><div class="row"><b>Clear all data</b><button class="btn danger" onclick="resetData()">Reset</button></div><div class="row"><b>Sign out</b><button class="btn outline" onclick="logout()">Sign out</button></div></div>`,`FINORA`,`by Kalu Obinna`)}
function catIcon(c){return ({Food:'◉',Transport:'⌁',Bills:'▤',Shopping:'◇',Savings:'◎',Income:'↗',Other:'•'})[c]||'•'}
function ensureWallet(){if(!d.wallets.length){d.wallets.push({id:Date.now(),name:'Main Wallet',type:'Bank',bal:0});save()}}

function connectionRows(){if(!d.connections?.length)return '<div class="empty"><b>No account connected yet.</b><div style="margin-top:6px">Connect OPay or a supported Nigerian bank to bring balances and transactions into FINORA.</div><button class="btn primary" style="margin-top:12px" onclick="connectAccount()">Connect an account</button></div>';return d.connections.map(c=>`<div class="row"><div class="txleft"><div class="iconbox">🏦</div><div><b>${esc(c.institution||'Connected account')}</b><div class="muted">${esc(c.accountName||'Account')} • ${esc(c.status||'Connected')}</div></div></div><span class="tag">${esc(c.status||'Connected')}</span></div>`).join('')}
function connectAccount(){if(!d.user?.email)return toast('Set up your FINORA account first');openModal(`<h2>Connect a bank or OPay</h2><div class="card setup"><b>Secure connection</b><div class="muted" style="margin-top:5px">FINORA uses an authorized open-banking connection. Your bank login details are entered in the secure provider flow, not stored in FINORA.</div></div><div class="section">Supported connection</div><div class="mini-grid"><div class="mini"><b>OPay</b><div class="muted">Mobile money</div></div><div class="mini"><b>Banks</b><div class="muted">GTBank, Access, UBA, Zenith & more</div></div><div class="mini"><b>Secure</b><div class="muted">Consent controlled by you</div></div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="startMonoLink()">Continue to secure connection</button><div class="muted" style="margin-top:10px">Bank connection is powered by Mono. Your account data stays under your control.</div>`)}
async function startMonoLink(){const b=document.querySelector('#modalBody .primary');b&&(b.disabled=true,b.textContent='Opening secure connection…');try{const r=await fetch('/.netlify/functions/mono-init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:d.user.name,email:d.user.email})});const j=await r.json();if(!r.ok||!j.mono_url)throw new Error(j.message||'Connection service is not configured yet.');window.location.href=j.mono_url}catch(e){if(b){b.disabled=false;b.textContent='Continue to secure connection'}toast(e.message||'Unable to start connection');}}

async function syncMonoConnection(ref,attempt=0){
  if(!ref)return;
  try{
    const r=await fetch('/.netlify/functions/mono-sync?ref='+encodeURIComponent(ref));
    const j=await r.json().catch(()=>({}));
    if(r.status===202 && attempt<5){toast('Bank linked. Waiting for account data…');setTimeout(()=>syncMonoConnection(ref,attempt+1),2500);return;}
    if(!r.ok)throw new Error(j.message||'Unable to retrieve your bank data yet.');
    const a=j.account||{};
    let w=d.wallets.find(x=>x.monoAccountId===a.id);
    if(!w){w={id:'mono-'+a.id,name:a.institution||'Connected bank',type:'Bank',bal:Number(a.balance)||0,monoAccountId:a.id};d.wallets.push(w);}else{w.bal=Number(a.balance)||0;w.name=a.institution||w.name;}
    const connection={id:a.id,institution:a.institution||'Connected bank',accountName:a.name||'Bank account',accountNumber:a.account_number||'',balance:Number(a.balance)||0,status:'Connected',currency:a.currency||'NGN',ref};
    d.connections=(d.connections||[]).filter(c=>c.id!==a.id);d.connections.unshift(connection);
    const incoming=j.transactions||[];const existing=new Set((d.tx||[]).map(t=>t.monoId).filter(Boolean));
    incoming.reverse().forEach(t=>{if(existing.has(t.id))return;const dt=new Date(t.date);const catMap={food:'Food',transport:'Transport',utilities:'Bills',rent:'Bills',shopping:'Shopping',salary:'Income',savings:'Savings'};const raw=String(t.category||'other').toLowerCase();const cat=catMap[raw]||((t.amount||0)>0?'Income':'Other');d.tx.unshift({id:Date.now()+Math.random(),monoId:t.id,iso:isNaN(dt)?new Date().toISOString().slice(0,10):dt.toISOString().slice(0,10),date:isNaN(dt)?String(t.date||''):dt.toLocaleDateString('en-NG',{day:'numeric',month:'short'}),name:t.name||'Bank transaction',amount:Number(t.amount)||0,cat,wallet:w.id});});
    save();history.replaceState({},document.title,location.pathname);toast('Bank account connected and synced');render();
  }catch(e){if(attempt<2){setTimeout(()=>syncMonoConnection(ref,attempt+1),2500);}else toast(e.message||'Bank linked, but data is still being prepared.');}
}

function transactionModal(type){if(!d.wallets.length){ensureWallet();toast('Main Wallet created — you can now add transactions')}const cats=type==='income'?['Income']:Object.keys(d.categories);openModal(`<h2>${type==='income'?'Add income':'Add expense'}</h2><div class="form"><label>Amount<input id="amt" class="input" type="number" min="0" step="1" placeholder="25000"></label><label>Description<input id="desc" class="input" placeholder="e.g. Groceries"></label><label>Category<select id="cat" class="select">${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label><label>Wallet<select id="wal" class="select">${d.wallets.map(w=>`<option value="${w.id}">${esc(w.name)} — ${money(w.bal)}</option>`).join('')}</select></label><button class="btn primary" onclick="addTx('${type}')">Save transaction</button></div>`)}
function addTx(type){const a=Number(document.getElementById('amt').value),name=document.getElementById('desc').value.trim()||'Transaction',cat=document.getElementById('cat').value,w=wallet(document.getElementById('wal').value);if(!w)return toast('Choose a wallet');if(!a||a<0)return toast('Enter an amount');if(type==='expense'&&w.bal<a)return toast('Not enough funds');w.bal+=type==='income'?a:-a;const now=new Date();d.tx.unshift({id:Date.now(),iso:now.toISOString().slice(0,10),date:now.toLocaleDateString('en-NG',{day:'numeric',month:'short'}),name,amount:type==='income'?a:-a,cat,wallet:w.id});save();closeModal();toast(type==='income'?'Income added':'Expense added');render()}
function transferModal(){if(d.wallets.length<2){openModal(`<h2>Transfer money</h2><p class="muted">Add at least two wallets before making a transfer.</p><button class="btn primary" onclick="closeModal();walletModal()">Add wallet</button>`);return}openModal(`<h2>Transfer money</h2><div class="form"><label>Amount<input id="amt" class="input" type="number" min="0" placeholder="10000"></label><label>From<select id="from" class="select">${d.wallets.map(w=>`<option value="${w.id}">${esc(w.name)} — ${money(w.bal)}</option>`).join('')}</select></label><label>To<select id="to" class="select">${d.wallets.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></label><button class="btn primary" onclick="transfer()">Transfer</button></div>`)}
function transfer(){const a=Number(document.getElementById('amt').value),from=wallet(document.getElementById('from').value),to=wallet(document.getElementById('to').value);if(!a||from.id===to.id)return toast('Check amount and wallets');if(from.bal<a)return toast('Not enough funds');from.bal-=a;to.bal+=a;const now=new Date();d.tx.unshift({id:Date.now(),iso:now.toISOString().slice(0,10),date:now.toLocaleDateString('en-NG',{day:'numeric',month:'short'}),name:`Transfer to ${to.name}`,amount:-a,cat:'Other',wallet:from.id});save();closeModal();toast('Transfer completed');render()}
function editBudget(){openModal(`<h2>Monthly budget</h2><div class="form"><label>Total monthly limit<input id="bud" class="input" type="number" min="0" value="${d.budget}"></label><div class="section" style="margin:8px 0 0">Category limits</div>${Object.entries(d.categories).map(([c,v])=>`<label>${c}<input id="cat_${c}" class="input" type="number" min="0" value="${v}"></label>`).join('')}<button class="btn primary" onclick="saveBudget()">Save budget</button></div>`)}
function saveBudget(){d.budget=Number(document.getElementById('bud').value)||0;Object.keys(d.categories).forEach(c=>d.categories[c]=Number(document.getElementById('cat_'+c).value)||0);save();closeModal();toast('Budget updated');render()}
function goalModal(){openModal(`<h2>Create savings goal</h2><div class="form"><label>Goal name<input id="gn" class="input" placeholder="Emergency Fund"></label><label>Target amount<input id="gt" class="input" type="number" min="1" placeholder="500000"></label><label>Starting amount<input id="gs" class="input" type="number" min="0" placeholder="0"></label><button class="btn primary" onclick="addGoal()">Create goal</button></div>`)}
function addGoal(){const name=document.getElementById('gn').value.trim(),target=Number(document.getElementById('gt').value),saved=Number(document.getElementById('gs').value)||0;if(!name||!target)return toast('Enter a goal and target');d.goals.push({id:Date.now(),name,saved,target});save();closeModal();toast('Savings goal created');render()}
function fundGoal(id){const g=d.goals.find(x=>x.id===id);if(!g)return;openModal(`<h2>Add to ${esc(g.name)}</h2><div class="form"><label>Amount<input id="ga" class="input" type="number" min="1" placeholder="10000"></label><button class="btn primary" onclick="saveGoalFunding(${id})">Add to goal</button></div>`)}
function saveGoalFunding(id){const a=Number(document.getElementById('ga').value),g=d.goals.find(x=>x.id===id);if(!a||!g)return toast('Enter an amount');g.saved+=a;save();closeModal();toast('Savings updated');render()}
function walletModal(){openModal(`<h2>Add wallet</h2><div class="form"><label>Wallet name<input id="wn" class="input" placeholder="Main Account"></label><label>Type<select id="wt" class="select"><option>Bank</option><option>Cash</option><option>Savings</option><option>Mobile Money</option></select></label><label>Opening balance<input id="wb" class="input" type="number" min="0" placeholder="0"></label><button class="btn primary" onclick="addWallet()">Create wallet</button></div>`)}
function addWallet(){const name=document.getElementById('wn').value.trim(),type=document.getElementById('wt').value,bal=Number(document.getElementById('wb').value)||0;if(!name)return toast('Enter a wallet name');d.wallets.push({id:Date.now(),name,type,bal});save();closeModal();toast('Wallet added');render()}
function editWallet(id){const w=wallet(id);if(!w)return;openModal(`<h2>Edit wallet</h2><div class="form"><label>Wallet name<input id="wn" class="input" value="${esc(w.name)}"></label><label>Type<select id="wt" class="select">${['Bank','Cash','Savings','Mobile Money'].map(x=>`<option ${x===w.type?'selected':''}>${x}</option>`).join('')}</select></label><button class="btn primary" onclick="updateWallet(${id})">Save changes</button></div>`)}
function updateWallet(id){const w=wallet(id);w.name=document.getElementById('wn').value.trim()||w.name;w.type=document.getElementById('wt').value;save();closeModal();toast('Wallet updated');render()}
function recurringModal(){openModal(`<h2>Recurring item</h2><div class="form"><label>Name<input id="rn" class="input" placeholder="Rent"></label><label>Amount<input id="ra" class="input" type="number" min="0" placeholder="150000"></label><label>Type<select id="rt" class="select"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Day of month<select id="rd" class="select">${Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label><button class="btn primary" onclick="addRecurring()">Save recurring item</button></div>`)}
function addRecurring(){const name=document.getElementById('rn').value.trim(),amount=Number(document.getElementById('ra').value),type=document.getElementById('rt').value,day=Number(document.getElementById('rd').value);if(!name||!amount)return toast('Complete the fields');d.recurring.push({id:Date.now(),name,amount,type,day});save();closeModal();toast('Recurring item added');render()}
function deleteRecurring(id){d.recurring=d.recurring.filter(r=>r.id!==id);save();toast('Recurring item deleted');render()}
function deleteTx(id){d.tx=d.tx.filter(t=>t.id!==id);save();toast('Transaction deleted');render()}
function backup(){const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finora-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup exported')}
function resetData(){if(confirm('Clear all FINORA data?')){d=blank();localStorage.removeItem(KEY);localStorage.removeItem('finora_logged_v8');logged=false;render()}}
function logout(){localStorage.removeItem('finora_logged_v8');logged=false;render()}
function login(){const name=document.getElementById('loginName').value.trim(),email=document.getElementById('loginEmail').value.trim();if(!name||!email)return toast('Enter your name and email');d.user={name,email};ensureWallet();save();localStorage.setItem('finora_logged_v8','1');logged=true;render()}
function loginScreen(){return `<div class="login"><div class="loginbox"><img class="loginhero" src="/finora-lockup.png" alt="FINORA — by Kalu Obinna"><h1>Welcome to FINORA</h1><p>Know your money. Grow your future.</p><div class="card setup"><b>Set up your account</b><div class="muted" style="margin-top:4px">Start with your own wallets, budgets and goals.</div></div><div class="form" style="margin-top:16px"><label>Name<input id="loginName" class="input" placeholder="Your name" value="${esc(d.user.name)}"></label><label>Email<input id="loginEmail" class="input" type="email" placeholder="you@example.com" value="${esc(d.user.email)}"></label><button class="btn primary" onclick="login()">Enter FINORA</button></div></div></div>`}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
function render(){document.getElementById('root').innerHTML=!logged?loginScreen():({home,tx,budget,insights,more}[page]||home)()}
render();if(new URLSearchParams(location.search).get('mono')==='complete'){const monoRef=new URLSearchParams(location.search).get('ref');setTimeout(()=>syncMonoConnection(monoRef),400);}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
</script></body></html>
